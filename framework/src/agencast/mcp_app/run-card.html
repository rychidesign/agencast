<style>

[data-state=succeeded]{--status:var(--success)}[data-state=failed]{--status:var(--error)}[data-state=running]{--status:var(--running)}[data-state=interrupted],[data-state=warning]{--status:var(--warning)}[data-state=queued],[data-state=dry_run],[data-state=skipped],[data-state=not_reached]{--status:var(--neutral)}

@media(prefers-reduced-motion:no-preference){

<main class="card"><header class="head"><div id="summary"><div class="eyebrow">AGENCAST RUN</div><h1 class="title">AgenCast run</h1><div class="meta"><span id="project">Waiting for run data.</span><span id="run-id"></span></div></div><span id="badge" class="badge" aria-live="polite">waiting</span></header><div id="bar" class="bar" role="progressbar" aria-label="Run progress" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span class="segment"><span class="fill"></span></span></div><div class="progress-meta"><span id="progress">— / — steps</span><span class="metrics"><span id="elapsed">Elapsed: —</span> · <span id="cost">—</span></span></div><div id="body"></div><div id="problem" class="error" role="alert"></div></main>

<script>
(()=>{

  const calls=new Map(), images=new Map(), asked=new Set(), imageTypes=new Set(['image/png','image/jpeg','image/webp','image/gif']);

  // Lucide paths copied from the GUI's installed icons (ISC); geometry shared by both status and kind icons.
  const paths={"check":["M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0","m16 9-5.5 5.5L8 12"],"x":["M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0","m15 9-6 6","m9 9 6 6"],"dot":["M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0","M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"],"dashed":["M10.1 2.182a10 10 0 0 1 3.8 0","M13.9 21.818a10 10 0 0 1-3.8 0","M17.609 3.721a10 10 0 0 1 2.69 2.7","M2.182 13.9a10 10 0 0 1 0-3.8","M20.279 17.609a10 10 0 0 1-2.7 2.69","M21.818 10.1a10 10 0 0 1 0 3.8","M3.721 6.391a10 10 0 0 1 2.7-2.69","M6.391 20.279a10 10 0 0 1-2.69-2.7"],"warning":["m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3","M12 9v4","M12 17h.01"],"slash":["M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0","M9 15L15 9"],"file":["M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z","M14 2v5a1 1 0 0 0 1 1h5","M10 9H8","M16 13H8","M16 17H8"],"ask":["M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"],"task":["M12 8V4H8","M6 8h12a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-8a2 2 0 0 1 2 -2Z","M2 14h2","M20 14h2","M15 13v2","M9 13v2"],"jev":["M12 3v18","m19 8 3 8a5 5 0 0 1-6 0zV7","M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1","m5 8 3 8a5 5 0 0 1-6 0zV7","M7 21h10"],"image":["M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2Z","M7 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0","m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"],"parallel":["M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2Z","M12 3v18"],"switch":["M16 3h5v5","M8 3H3v5","M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3","m15 9 6-6"],"call":["m15 10 5 5-5 5","M4 4v7a4 4 0 0 0 4 4h12"],"set":["M5 9L19 9","M5 15L19 15"],"fail":["m15 9-6 6","M2.586 16.726A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2h6.624a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586z","m9 9 6 6"],"output":["M12 22V12","m16 17 2 2 4-4","M21 11.127V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.729l7 4a2 2 0 0 0 2 .001l1.32-.753","M3.29 7 12 12l8.71-5","m7.5 4.27 8.997 5.148"],"circle":["M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"]};
  const states={succeeded:'check',failed:'x',running:'dot',queued:'dashed',skipped:'dashed',warning:'warning',interrupted:'slash',dry_run:'file'};
  const motion=matchMedia('(prefers-reduced-motion: no-preference)');
  const stepRows=new Map(), sections=new Map();
  const setText=(el,value)=>{if(el.textContent!==String(value))el.textContent=value;};

  function status(el,state,label=false){
    if(el.dataset.state===state)return;
    el.dataset.state=state;
    let slot=el.querySelector('.icon-slot');
    if(!slot){el.replaceChildren();slot=add(el,'span',undefined,'icon-slot');add(el,'span','',label?'status-label':'sr-only');}
    for(const old of slot.children){if(motion.matches){old.classList.remove('icon-enter');old.classList.add('outgoing');const remove=e=>{if(e.target===old&& e.animationName==='fade-out')old.remove();};old.addEventListener('animationend',remove);old.addEventListener('animationcancel',remove);}else old.remove();}

  }
  function row(parent,key,value){const line=add(parent,'div',undefined,'row');add(line,'span',key+': ','key');add(line,'span',value,'value');return line;}
  function section(name,key,build){
    let saved=sections.get(name);

    if(!saved){const el=add(body,'section',undefined,'section');add(el,'h2',name);saved={el,content:add(el,'div')};sections.set(name,saved);animate(el,'section-enter');}

  }
  function render(){
    if(!run){resize();return;}
    const state=run.state||run.status||'unknown', changed=bar.dataset.state!==state;
    card.dataset.done=String(!!run.done);status(badge,state,true);
    setText(q('.title'),run.scenario||'unknown scenario');setText(q('#project'),(run.project||'unknown project')+' · ');setText(q('#run-id'),run.run_id||'—');
    const steps=Array.isArray(run.steps)?run.steps.filter(s=>s&& typeof s==='object'):[];

    const done_=run.steps_done!=null?run.steps_done:(run.done&& steps.length?steps.filter(s=>['succeeded','skipped'].includes(s.status)&&!String(s.step).includes('/')).length:null);
    setText(q('#progress'),(done_??'—')+' / '+(run.steps_total??'—')+' steps'+(run.current_step?' · '+run.current_step:''));
    setText(q('#elapsed'),'Elapsed: '+elapsed());
    const price=q('#cost'), priceText=cost(run.cost_usd);if(price.textContent!==priceText){setText(price,priceText);animate(price,'cost-flash');}
    const total=Number.isInteger(run.steps_total)&& run.steps_total>0?run.steps_total:1;
    while(bar.children.length<total){const segment=add(bar,'span',undefined,'segment');segment.style.setProperty('--i',bar.children.length-1);add(segment,'span',undefined,'fill');}
    while(bar.children.length>total)bar.lastElementChild.remove();
    bar.style.setProperty('--n',total);bar.setAttribute('aria-valuemax',total);bar.setAttribute('aria-valuenow',Math.min(total,Math.max(0,done_??0)));bar.setAttribute('aria-valuetext',state+': '+q('#progress').textContent);

        const path=step.step||step.dir||'', key=JSON.stringify(step);keep.add(path);
        let saved=stepRows.get(path);

        if(saved.key===key)continue;saved.key=key;saved.el.dataset.state=step.status||'unknown';status(saved.status,step.status||'unknown');
        if(saved.kind.dataset.kind!==step.kind){saved.kind.dataset.kind=step.kind;saved.kind.replaceChildren(icon(['ask','task','jev','image','parallel','switch','call','set','fail','output'].includes(step.kind)?step.kind:'circle'));setText(saved.kindLabel,step.kind||'');}
        setText(saved.id,step.step||'');setText(saved.metrics,[step.duration_s==null?'':Number(step.duration_s).toFixed(2)+'s',step.cost_usd==null?'':cost(step.cost_usd)].filter(Boolean).join(' · '));
        saved.error.hidden=!step.error;setText(saved.error,step.error?(step.error.class||'error')+(step.error.message?': '+step.error.message:''):'');
      }

    }else if(q('#steps')){q('#steps').parentElement.remove();stepRows.clear();}

    if(warnings)section('Warnings',JSON.stringify(run.warnings),content=>{for(const warning of run.warnings){const line=add(content,'div',undefined,'row warning-row');line.append(icon('warning'));add(line,'span',warning);}});
    if(run.error)section('Error',JSON.stringify(run.error),content=>add(content,'div',(run.error.class||'error')+(run.error.step?' · '+run.error.step:'')+(run.error.message?': '+run.error.message:''),'error'));

    });

  function call(name,args,done){if(dead)return;const id='agencast-'+(++nextId);calls.set(id,done);post({id,method:'tools/call',params:{name,arguments:args}});}
  // one image at a time: each answer can be a megabyte of base64

  function fetch_(delay){clearTimeout(pollTimer);pollTimer=setTimeout(()=>call('run_status',{project:run.project,run_id:run.run_id,detail:true},result=>{if(result?.isError){stop(message(result));return;}const value=data(result);if(!value){stop('The host returned invalid run data.');return;}show(value);}),delay);}
  function schedule(){if(dead||!run||run.done)return;const long=run.state==='running'&& Date.now()-(runningAt||Date.now())>=60000;fetch_(long?5000:2000);}
  // unchanged data keeps the DOM, so a selection (the run_id to quote) survives the poll
  let detailed=false;  // a finished run handed over without detail (run_status without detail: true) gets its steps once
  function show(value){if(dead||!value||typeof value!=='object')return;const key=JSON.stringify(value);if(key!==shown){shown=key;run=value;if(run.state==='running'&&!runningAt)runningAt=run.started_at?Date.parse(run.started_at)||Date.now():Date.now();render();}if(!run.done)schedule();else if(!Array.isArray(run.steps)&&!detailed){detailed=true;fetch_(0);}else files();}
  tickTimer=setInterval(()=>{if(run&&!run.done){setText(q('#elapsed'),'Elapsed: '+elapsed());resize();}},1000);
  animate(card,'card-enter');
  window.addEventListener('message',event=>{if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;const msg=event.data;
    if(msg.id==='agencast-init'){clearTimeout(initTimer);if(msg.error){stop(msg.error.message||'The host refused to initialize the card.');return;}post({method:'ui/notifications/initialized'});resize();return;}
    if(msg.id&& calls.has(msg.id)){const done=calls.get(msg.id);calls.delete(msg.id);done(msg.result||{isError:true,content:[{type:'text',text:msg.error?.message||'The tool call failed.'}]});return;}
    if(msg.method==='ui/notifications/tool-result'){if(msg.params?.isError){stop(message(msg.params));return;}const value=data(msg.params);if(value)show(value);else stop('The host returned invalid run data.');return;}
    if(msg.method==='ui/notifications/host-context-changed')return;
    if(msg.method==='ui/notifications/tool-input')return;
    if(msg.method==='ui/resource-teardown'){dead=true;stop();clearInterval(tickTimer);clearTimeout(initTimer);post({id:msg.id,result:{}});}
  });
  if(typeof ResizeObserver==='function')new ResizeObserver(resize).observe(document.documentElement);
  post({id:'agencast-init',method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'AgenCast run card',version:'1'},appCapabilities:{availableDisplayModes:['inline']}}});
  initTimer=setTimeout(()=>stop('The host did not initialize the card.'),5000);
})();
</script>
