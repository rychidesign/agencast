[project]
name = "agencast"
version = "0.16.2"
description = "AgenCast — jádro frameworku multiagent-workflows (scénáře v YAML, agenti v Markdownu, OpenRouter)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
    "httpx>=0.27",
    "mcp==2.2.*",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
agencast = "agencast.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Sestavené GUI (framework/src/agencast/ui/, výstup npm run build v ui/) do wheelu, i když ho git ignoruje.
[tool.hatch.build.targets.wheel]
artifacts = ["/src/agencast/ui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testy se sítí nebo skutečným npx serverem: jen `uv run pytest -m live`; běžná sada je hermetická (DESIGN §5.9).
markers = ["live: potřebuje síť nebo skutečný MCP server přes npx — spouštět jen `-m live`"]
addopts = "-m 'not live'"
