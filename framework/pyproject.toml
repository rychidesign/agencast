[project]
name = "agencast"
version = "0.19.0"
description = "AgenCast — scenarios with LLM agents: YAML scenarios, Markdown agents, models via OpenRouter"
readme = "README.md"
license = "WTFPL"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
    "httpx>=0.27",
    "mcp==2.2.*",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/rychidesign/agencast"
Repository = "https://github.com/rychidesign/agencast"

[project.scripts]
agencast = "agencast.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Include the built GUI (framework/src/agencast/ui/, output of npm run build in ui/) in the wheel even though git ignores it.
[tool.hatch.build.targets.wheel]
artifacts = ["/src/agencast/ui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests using the network or a real npx server: only with `uv run pytest -m live`; the regular suite is hermetic (DESIGN §5.9).
markers = ["live: requires network access or a real MCP server via npx — run only with `-m live`"]
addopts = "-m 'not live'"

[tool.hatch.build.targets.wheel.force-include]
"../skills/agencast-run" = "agencast/skills/agencast-run"
"../skills/agencast-create" = "agencast/skills/agencast-create"
"../docs/getting-started.md" = "agencast/docs/getting-started.md"
"../docs/spec" = "agencast/docs/spec"
"../docs/tutorials" = "agencast/docs/tutorials"
"../examples/README.md" = "agencast/examples/README.md"
"../examples/showcase/workflows" = "agencast/examples/showcase/workflows"
"../examples/showcase/fake" = "agencast/examples/showcase/fake"
"../examples/showcase/.env.example" = "agencast/examples/showcase/.env.example"
"../examples/tutorial/workflows" = "agencast/examples/tutorial/workflows"
"../examples/tutorial/fake" = "agencast/examples/tutorial/fake"
"../examples/tutorial/.env.example" = "agencast/examples/tutorial/.env.example"

[tool.hatch.build.hooks.custom]
