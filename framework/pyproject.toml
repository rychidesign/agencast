[project]
name = "maw"
version = "0.2.0"
description = "multiagent-workflows — jádro frameworku (scénáře v YAML, agenti v Markdownu, OpenRouter)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
    "httpx>=0.27",
    "mcp==2.2.*",
]

[project.scripts]
maw = "maw.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
