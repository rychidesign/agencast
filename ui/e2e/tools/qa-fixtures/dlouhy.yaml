version: 1
name: dlouhy
description: Pomalý běh pro živé sledování
inputs:
  tema: { type: string, default: káva }
outputs:
  text: { type: string }
steps:
  - id: pomalu
    ask:
      agent: pisatel
      prompt: "Pomalu: {{ inputs.tema }}"
  - id: vystup
    output:
      text: "{{ steps.pomalu.text }}"
