version: 1
name: kontrola-tonu
description: Zkontroluje, že text sedí na tón značky Lumen (volá se krokem call z jiných scénářů)
callable: true

inputs:
  text:
    type: string
    required: true
    description: Text ke kontrole
  prah:
    type: number
    default: 0.7
    description: Od jaké hodnoty on_brand je text v pořádku

outputs:
  on_brand:
    type: number
    description: Míra shody s tónem značky od 0 do 1
  v_poradku:
    type: boolean
    description: on_brand dosáhl prahu

steps:
  # 1. Jev ohodnotí text; noul = míra „ano" od 0 do 1.
  - id: kontrola
    jev:
      state: "{{ inputs.text }}"
      questions:
        on_brand:
          type: noul
          instructions: >-
            Odpovídá text tónu kavárny Lumen — česky, krátce, přátelsky a věcně,
            tyká, bez emoji a reklamních klišé?

  # 2. Porovnání s prahem; o tom, co dál, rozhoduje volající scénář.
  - id: vysledek
    set:
      v_poradku: steps.kontrola.on_brand >= inputs.prah

  # 3. Výstup pro volající scénář (steps.<id>.on_brand, steps.<id>.v_poradku).
  - id: out
    output:
      on_brand: "{{ steps.kontrola.on_brand }}"
      v_poradku: "{{ steps.vysledek.v_poradku }}"
