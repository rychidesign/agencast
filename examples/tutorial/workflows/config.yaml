# config.yaml for Phase 2 (created from config.example.yaml, aliases point to cheap models).
# Changed by the owner only. No secret values: the *_env fields contain the NAME
# of an environment variable; the value is in .env (server) or in modal.Secret.
# Specification: docs/spec/config.md
version: 1

openrouter:
  api_key_env: OPENROUTER_API_KEY
  jev_model: jev-1.13

# Model aliases. Agents and scenarios know only the left-hand side.
models:
  smart:       { id: anthropic/claude-haiku-4.5 }
  fast:       { id: google/gemini-3.5-flash-lite, structured_output: tool_wrapper }
  gemini-image: { id: google/gemini-3.1-flash-image }
  gemini-image-api: { id: google/gemini-3.1-flash-image, api: images }   # Images API: reference images (image.images)

# Folder with run records (on Modal, a path to the Volume).
runs_dir: ./runs

# Where files from the output step are uploaded. The framework does not support R2 yet (Phase 3),
# hence a local folder; the callback then carries a file:// path (unusable for Instagram).
storage:
  type: local
  local:
    path: ./outputs

# Safety limits for a single run.
limits:
  run_budget_usd: 1.00
  run_image_budget_usd: 0.30
  run_timeout: 1h
  max_call_depth: 3

webhook:
  token_env: WEBHOOK_TOKEN

callback:
  secret_env: CALLBACK_SECRET
