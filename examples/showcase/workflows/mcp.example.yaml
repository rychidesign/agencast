# Ukázka mcp.yaml — registr MCP serverů. Mění jen vlastník.
# Tady se rozhoduje, kdo smí co použít (agents, scenarios, tools).
# Tokeny jen jménem proměnné prostředí. Specifikace: docs/spec/config.md
version: 1

servers:
  filesystem:
    description: Čtení a zápis v pracovní složce aktuálního běhu
    command: npx
    args: ["@modelcontextprotocol/server-filesystem", "{run_dir}/work"]
    agents: [knihovnik]

  instagram:
    description: Publikace na Instagram (vzdálený server, adresa je příklad)
    url: https://mcp.example.com/instagram
    bearer_token_env: IG_MCP_TOKEN
    agents: [publisher]              # jen tento agent smí server použít
    scenarios: [ig-publish]          # jen z tohoto scénáře (část 2, po schválení)
    tools: [create_media, publish_media]
    timeouts: { handshake: 10s, call: 120s }
