version: 1
name: obrazek
description: Vygeneruje obrázek pro kavárnu Lumen se zadáním, poměrem a kvalitou od volajícího
callable: true
inputs:
  zadani: { type: string, default: "Šálek kávy na bílém stole v kavárně Lumen, bez nápisů a log" }
  pomer: { type: string, default: "1:1" }
  kvalita: { type: string, default: medium }
outputs:
  soubor: { type: file }
steps:
  - id: foto
    image:
      model: gemini-image
      prompt: "{{ inputs.zadani }}"
      aspect_ratio: "{{ inputs.pomer }}"
      quality: "{{ inputs.kvalita }}"
  - id: out
    output:
      soubor: "{{ steps.foto.file }}"
