version: 1
name: ig-post
description: Draft IG post for approval (part 1; part 2 publishes it via n8n)

inputs:
  topic:
    type: string
    required: true
    description: What the post should be about

outputs:
  caption:
    type: string
    description: Post text
  hashtags:
    type: list
    description: Hashtags, each starting with a hash sign
  image:
    type: file
    description: Photo for the post — a URL in the callback

# Step numbers in the comments match the table in the run record's summary.md.
steps:
  # 1. The copywriter writes the text, hashtags and a photo idea.
  - id: copy
    ask:
      agent: copywriter
      prompt: "Write an IG post about: {{ inputs.topic }}"
      schema:
        caption: string
        hashtags: [string]
        image_idea: string

  # 2. Jev checks that the text matches the brand tone.
  #    noul = degree of "yes" from 0 to 1; 0.5 = Jev is not sure.
  - id: tone_check
    jev:
      state: "{{ steps.copy.caption }}"
      questions:
        on_brand:
          type: noul
          instructions: >-
            Does the text match the tone of Lumen café — English, short, friendly and
            matter-of-fact, talks to the reader directly, no emoji and no advertising clichés?

  # 3. If not, the run ends with an error and n8n sends an alert.
  - id: stop
    when: steps.tone_check.on_brand < 0.7
    fail: "The text does not match the brand (on_brand = {{ steps.tone_check.on_brand }})"

  # 4. The photographer turns the idea into a precise photo description for the generator.
  - id: photo_prompt
    ask:
      agent: photographer
      prompt: |
        Post text: {{ steps.copy.caption }}
        Photo idea: {{ steps.copy.image_idea }}
      schema:
        photo_description: string

  # 5. The provider refuses nothing on its own, so we check the photo description ourselves.
  - id: image_check
    jev:
      state: "{{ steps.photo_prompt.photo_description }}"
      questions:
        real_person:
          type: noul
          instructions: Does the text describe a specific real or well-known person?
        other_brand:
          type: noul
          instructions: Does the text mention a logo or brand of a company other than Lumen?

  # 6. If the description breaks the rules, the run ends.
  #    A stricter threshold than for the tone: better to stop.
  - id: stop_image
    when: steps.image_check.real_person > 0.5 or steps.image_check.other_brand > 0.5
    fail: "The photo description breaks the content rules: {{ steps.photo_prompt.photo_description }}"

  # 7. The photo is generated in the Instagram format.
  - id: photo
    image:
      model: gemini-image
      prompt: "{{ steps.photo_prompt.photo_description }}"
      aspect_ratio: "4:5"

  # 8. The result for n8n: text, hashtags and photo URL for approval.
  - id: out
    output:
      caption: "{{ steps.copy.caption }}"
      hashtags: "{{ steps.copy.hashtags }}"
      image: "{{ steps.photo.file }}"
