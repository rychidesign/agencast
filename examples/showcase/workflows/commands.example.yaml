# Sample commands.yaml — commands for a future `run` step (not implemented
# in v1, only the structure is shown here). Changed by the owner only.
# Specification: docs/spec/config.md
version: 1

commands:
  resize-image:
    description: Resizes an image to the width for Instagram
    program: /usr/bin/convert          # absolute path, never through a shell
    args: ["{{ params.input }}", "-resize", "{{ params.width }}x", "{{ params.output }}"]
    params:
      input:  { type: file }
      width:  { type: integer, min: 320, max: 1440 }
      output: { type: string, pattern: "^[a-z0-9_-]+\\.jpg$" }
    timeout: 60s
