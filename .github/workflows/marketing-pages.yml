name: Marketing demo

on:
  push:
    branches: [main]
    paths: ['docs/marketing/**', '.github/workflows/marketing-pages.yml']
  pull_request:
    paths: ['docs/marketing/**', '.github/workflows/marketing-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and package demos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci && npx playwright install --with-deps chromium
      - name: Check both animations
        run: |
          node docs/marketing/render.mjs "$RUNNER_TEMP/original-check" --check
          node docs/marketing/render-camera.mjs "$RUNNER_TEMP/camera-check" --check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package static assets
        run: |
          mkdir -p "$RUNNER_TEMP/agencast-demo-site"
          cp docs/marketing/agent-workflow*.{html,png,mp4,gif} "$RUNNER_TEMP/agencast-demo-site/"
          cp docs/marketing/agent-workflow-camera.html "$RUNNER_TEMP/agencast-demo-site/index.html"
          touch "$RUNNER_TEMP/agencast-demo-site/.nojekyll"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/agencast-demo-site

  deploy:
    name: Publish demo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
