version: 1
name: ukazka-call
description: Ukázka kroku call — copywriter napíše text, scénář kontrola-tonu ho zkontroluje

inputs:
  tema:
    type: string
    required: true
    description: O čem má text být

outputs:
  caption:
    type: string
    description: Text příspěvku
  on_brand:
    type: number
    description: Hodnocení tónu ze scénáře kontrola-tonu

steps:
  # 1. Copywriter napíše text.
  - id: copy
    ask:
      agent: copywriter
      prompt: "Napiš IG příspěvek na téma: {{ inputs.tema }}"
      schema:
        caption: string

  # 2. Kontrola tónu jako vnořený scénář ve stejném běhu (stejný rozpočet, záznam v steps/02-ton/).
  - id: ton
    call:
      scenario: kontrola-tonu
      inputs:
        text: "{{ steps.copy.caption }}"

  # 3. Text mimo tón značky běh ukončí.
  - id: stop
    when: not steps.ton.v_poradku
    fail: "Text neodpovídá značce (on_brand = {{ steps.ton.on_brand }})"

  - id: out
    output:
      caption: "{{ steps.copy.caption }}"
      on_brand: "{{ steps.ton.on_brand }}"
