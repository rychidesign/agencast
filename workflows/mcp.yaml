# mcp.yaml — registr MCP serverů. Mění jen vlastník (DESIGN §4, §5.2).
# Vytvořeno ve Fázi 3a podle mcp.example.yaml. Tady se rozhoduje, kdo smí
# co použít: agents (povinné), scenarios a tools (volitelné).
# Tokeny jen jménem proměnné prostředí. Specifikace: docs/spec/config.md
version: 1

servers:
  # Pracovní složka běhu: server vidí jen runs/<běh>/work, nic jiného.
  # Verze balíčku je pevná (R7); na Modalu ho předinstalovat (D5).
  filesystem:
    description: Čtení a zápis v pracovní složce aktuálního běhu
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem@2026.8.31", "{run_dir}/work"]
    agents: [knihovnik, tutorial-archivar]
    tools: [list_allowed_directories, list_directory, read_text_file, write_file]

  # Z mcp.example.yaml, aby prošel schválený agent publisher. Adresa je
  # příklad — server se spustí až krokem task s tímto agentem.
  instagram:
    description: Publikace na Instagram (vzdálený server, adresa je příklad)
    url: https://mcp.example.com/instagram
    bearer_token_env: IG_MCP_TOKEN
    agents: [publisher]
    scenarios: [ig-publish]
    tools: [create_media, publish_media]
    timeouts: { handshake: 10s, call: 120s }
